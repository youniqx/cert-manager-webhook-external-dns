name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: make test-go

  test-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Helm >= 4.2.1 cannot install plugins from OCI registries:
          # https://github.com/helm/helm/issues/32247
          version: v4.2.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install helm-unittest plugin
        run: |
          gpg --import ./deploy/helm-unittest.public-key.asc
          gpg --export > "${HOME}/.gnupg/pubring.gpg"
          helm plugin install oci://ghcr.io/helm-unittest/helm-unittest/unittest@sha256:5ea10e89b7ec83cbdc3f55854ea729a674d694fafce0e190e6e314547816348a # v1.1.1

      - name: Run chart-testing (lint)
        run: ct lint --config=deploy/config.yaml --target-branch=${{ github.event.repository.default_branch }}

      - name: Run Helm chart unit tests
        run: |
          for chart in ./deploy/charts/*/; do
            helm dependency build "$chart"
            helm unittest "$chart" --output-file "${chart}results.xml" --output-type JUnit --strict
          done

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build multi-platform image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
