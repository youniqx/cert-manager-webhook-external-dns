{{/*
This APIService cannot be expressed through the bjw-s common library's
rawResources, because the cert-manager.io/inject-ca-from annotation must be
templated and rawResources renders annotations verbatim.
*/}}
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.{{ .Values.groupName }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/{{ include "bjw-s.common.lib.chart.names.fullname" . }}-webhook-tls"
spec:
  group: {{ .Values.groupName }}
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}
    namespace: {{ .Release.Namespace }}
  version: v1alpha1
